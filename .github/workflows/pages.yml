# Publishes the built page to GitHub Pages on every push to main: https://vviseguy.github.io/number-finder/
# The repository stays private; only the one built HTML file is public. It is served as index.html and
# also as numberfinder.html, which the page's "Download for offline use" button saves.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Arrange the site
        run: |
          mkdir -p _site
          cp dist/numberfinder.html _site/index.html
          cp dist/numberfinder.html _site/numberfinder.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
